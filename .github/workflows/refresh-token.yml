name: Refresh Instagram token
# Long-lived Instagram tokens last 60 days. This refreshes it weekly and saves it back as the IG_TOKEN secret.
# Needs a GH_PAT secret (fine-grained token with "Secrets: read and write" on this repo).
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh and store
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$IG_TOKEN" | python3 -c "import sys,json;print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$NEW" ]; then echo "refresh failed"; exit 1; fi
          gh secret set IG_TOKEN --repo "${{ github.repository }}" --body "$NEW"
          echo "token refreshed"
